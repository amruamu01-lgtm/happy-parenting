<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#DCC58E" />
      <stop offset="50%" stop-color="#C6A45B" />
      <stop offset="100%" stop-color="#9E7D32" />
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#174B3B" />
      <stop offset="100%" stop-color="#123F32" />
    </linearGradient>
  </defs>
  <!-- Background Disc -->
  <circle cx="100" cy="100" r="92" fill="url(#emeraldGrad)" stroke="url(#goldGrad)" stroke-width="4"/>
  <!-- Concentric Inner Circle -->
  <circle cx="100" cy="100" r="82" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="4 2"/>
  <!-- Islamic 8-Point Star Motif -->
  <g transform="translate(100,100) scale(0.65)">
    <rect x="-45" y="-45" width="90" height="90" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" rx="3" />
    <rect x="-45" y="-45" width="90" height="90" fill="none" stroke="url(#goldGrad)" stroke-width="2.5" rx="3" transform="rotate(45)" />
    <!-- Center Emblem: Stylized Book/Tree of Knowledge & Arch -->
    <path d="M 0,-30 C 15,-15 25,5 25,25 L -25,25 C -25,5 -15,-15 0,-30 Z" fill="none" stroke="#DCC58E" stroke-width="2.5"/>
    <path d="M -15,22 Q 0,10 15,22" fill="none" stroke="#C6A45B" stroke-width="2"/>
    <circle cx="0" cy="-6" r="4" fill="#C6A45B"/>
    <path d="M 0,-40 L 0,-32" stroke="#DCC58E" stroke-width="2.5" stroke-linecap="round"/>
  </g>
  <!-- Ornamental Crescent & Star at top -->
  <path d="M 100,24 A 6 6 0 0 1 100,36 A 5 5 0 0 0 100,26 Z" fill="#DCC58E" />
</svg>
